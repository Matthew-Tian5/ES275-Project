<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ES275 Website Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <section class="landing" aria-label="Red-headed Woodpecker introduction">
      <h2>The Red-headed Woodpecker</h2>
    </section>

    <section class="look-up" aria-labelledby="look-up-heading">
      <p class="look-up-kicker">Stop. Listen.</p>
      <h2 id="look-up-heading">Look up!</h2>
      <p>Did you hear that tapping in the trees?</p>
    </section>

        <header>
      <p>Made by Matthew, Cristiano, Maya, Kylie and Talia</p>
    </header>

    <div class="image-gallery">
      <img src="pictures/3A7BC7B0-3536-4DC6-AEED-777D0E93B49C.JPG" alt="Painting of a red-headed woodpecker" />
      <img src="pictures/11030032-31BF-4061-A74F-1377399171DE.JPG" alt="Endangered woodpecker sign painting" />
    </div>
    <section class="survey-section" aria-labelledby="survey-heading">
      <div class="survey-copy">
        <p class="survey-eyebrow">Help Us Improve</p>
        <h2 id="survey-heading">Take our short survey</h2>
        <p>Scan the QR code or use the button below to share your feedback.</p>
        <a class="survey-button" href="https://docs.google.com/forms/d/e/1FAIpQLSewy53zCivfYfpy8DF-dcNfbgzYs21wDIrXsRjszoo1Z2E_Pg/viewform" target="_blank" rel="noopener noreferrer">
          Open the survey
        </a>
      </div>
      <a class="qr-link" href="https://docs.google.com/forms/d/e/1FAIpQLSewy53zCivfYfpy8DF-dcNfbgzYs21wDIrXsRjszoo1Z2E_Pg/viewform" target="_blank" rel="noopener noreferrer" aria-label="Open the survey by QR code">
        <img src="pictures/qrcode.png" alt="QR code for the ES275 survey" />
      </a>
    </section>
  </body>
</html>
